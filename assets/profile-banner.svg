<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Anandan — terminal-native builder</title>
  <desc id="desc">A dark developer profile banner with a terminal window, a grid, and the words Building calm, capable tools for the terminal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#1b1240"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7bf1a8" stop-opacity="0"/>
      <stop offset="38%" stop-color="#7bf1a8"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#182540"/>
      <stop offset="100%" stop-color="#0d1327"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#a78bfa" stroke-opacity=".11"/>
    </pattern>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#grid)"/>
  <path d="M-40 330 C210 220 370 430 650 303 S1020 206 1330 320" fill="none" stroke="url(#line)" stroke-width="2"/>
  <path d="M-90 365 C190 255 400 455 676 336 S1040 245 1370 353" fill="none" stroke="#a78bfa" stroke-opacity=".35"/>
  <circle cx="104" cy="90" r="7" fill="#7bf1a8" filter="url(#glow)"/>
  <circle cx="125" cy="90" r="7" fill="#a78bfa"/>
  <circle cx="146" cy="90" r="7" fill="#f8b4d9"/>

  <text x="96" y="153" fill="#7bf1a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="3">ANANDAN / A8X</text>
  <text x="92" y="232" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">Building calm, capable tools</text>
  <text x="95" y="292" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="500">for the terminal.</text>
  <rect x="94" y="330" width="365" height="5" rx="2.5" fill="url(#line)"/>

  <g transform="translate(912 83)">
    <rect width="276" height="205" rx="15" fill="url(#terminal)" stroke="#7583aa" stroke-opacity=".46"/>
    <path d="M0 42H276" stroke="#7583aa" stroke-opacity=".4"/>
    <circle cx="24" cy="21" r="5" fill="#f8b4d9"/>
    <circle cx="42" cy="21" r="5" fill="#f9d08b"/>
    <circle cx="60" cy="21" r="5" fill="#7bf1a8"/>
    <text x="23" y="78" fill="#7bf1a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">$ whoami</text>
    <text x="23" y="107" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">terminal-native builder</text>
    <text x="23" y="143" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">$ focus --local-first</text>
    <text x="23" y="172" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">agents · tools · systems</text>
  </g>
  <text x="912" y="329" fill="#aab6d3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5">GO  ·  TYPESCRIPT  ·  SHELL</text>
</svg>
